[versions]
android = "8.8.2"
kotlin = "2.1.10"
coil = "3.0.4"

[plugins]
android-library = { id = "com.android.library", version.ref = "android" }
android-application = { id = "com.android.application", version.ref = "android" }

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
androidx-core-splashcreen = { module = "androidx.core:core-splashscreen", version = "1.1.0-rc01" }
compose-bom = { module = "androidx.compose:compose-bom", version = "2025.02.00" }
compose-material3 = { module = "androidx.compose.material3:material3" }

datastore-preferences = { module = "androidx.datastore:datastore-preferences", version = "1.1.3" }
koin-bom = { module = "io.insert-koin:koin-bom", version = "4.0.2" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }

ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.8.7" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.8.8" }

kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version = "1.8.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.8.0" }

okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version = "4.12.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

appwrite-android-sdk = { module = "io.appwrite:sdk-for-android", version = "10.0.0" }

commonmark = { module = "org.commonmark:commonmark", version = "0.26.0" }